# Docker Compose for AI-Based Behavioral IDS
version: '3.8'

services:
  ids-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ../outputs:/app/outputs
      - ../datasets:/app/datasets
    environment:
      - FLASK_ENV=production
      - API_TOKEN=ids-api-token-2026
    command: python -m api.server
    restart: unless-stopped

  ids-training:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../outputs:/app/outputs
      - ../datasets:/app/datasets
    command: >
      python scripts/train_model.py
      --dataset synthetic
      --epochs 50
      --batch-size 64
      --use-pca
      --use-smote
    profiles:
      - training

  ids-simulation:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../outputs:/app/outputs
    command: >
      python simulation/run_simulation.py
      --scenario all
    profiles:
      - simulation

volumes:
  ids-data:
  ids-models:
